<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DE10形ディーゼル機関車 運転シミュレータ</title>
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="mode-mainline">
  <div class="container">
    <header>
      <div class="header-title">
        <h1>DE10形ディーゼル機関車 運転シミュレータ</h1>
        <p class="subtitle">液体変速機（減速比切替）連動・引張力＆走行抵抗・均衡速度シミュレータ</p>
      </div>
      <div class="mode-selector-panel">
        <span class="panel-label">変速段切替 (動力台車減速比)</span>
        <div class="gear-toggle-group">
          <input type="radio" id="mode-mainline" name="gearMode" value="mainline" checked>
          <label for="mode-mainline" class="btn-mode btn-mainline">本線段 (0-85 km/h)</label>

          <input type="radio" id="mode-shunting" name="gearMode" value="shunting">
          <label for="mode-shunting" class="btn-mode btn-shunting">入換段 (0-45 km/h)</label>
        </div>
      </div>
    </header>

    <!-- 計器盤・ダッシュボード -->
    <section class="dashboard-grid">
      <div class="gauge-card">
        <span class="gauge-label">主幹制御器 (ノッチ)</span>
        <div class="gauge-value" id="display-notch">0 (惰行)</div>
        <div class="gauge-sub" id="display-mode-name">本線ギア接続中</div>
      </div>
      <div class="gauge-card">
        <span class="gauge-label">現在速度</span>
        <div class="gauge-value highlight" id="display-speed">0.0 <small>km/h</small></div>
        <div class="gauge-sub" id="display-speed-limit">最高許容: 85 km/h</div>
      </div>
      <div class="gauge-card">
        <span class="gauge-label">実効引張力</span>
        <div class="gauge-value text-red" id="display-traction">0 <small>kgf</small></div>
        <div class="gauge-sub">動輪周引張力</div>
      </div>
      <div class="gauge-card">
        <span class="gauge-label">総走行抵抗</span>
        <div class="gauge-value text-blue" id="display-resistance">0 <small>kgf</small></div>
        <div class="gauge-sub">列車抵抗 + 勾配抵抗</div>
      </div>
      <div class="gauge-card">
        <span class="gauge-label">算出 均衡速度</span>
        <div class="gauge-value text-green" id="display-balancing">0.0 <small>km/h</small></div>
        <div class="gauge-sub" id="display-acceleration">加速力: ±0 kgf</div>
      </div>
    </section>

    <!-- コントロール & パラメータ設定 -->
    <div class="main-layout">
      <section class="control-panel">
        <h2>運転操作・条件設定</h2>

        <!-- マスコン -->
        <div class="control-group">
          <div class="control-header">
            <label for="notch-slider">マスコンノッチ</label>
            <span class="control-val" id="notch-val">0 段</span>
          </div>
          <input type="range" id="notch-slider" min="0" max="14" step="1" value="0">
          <div class="scale-ticks">
            <span>OFF</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10</span><span>12</span><span>14</span>
          </div>
        </div>

        <!-- 速度 -->
        <div class="control-group">
          <div class="control-header">
            <label for="speed-slider">列車速度</label>
            <span class="control-val" id="speed-val">0.0 km/h</span>
          </div>
          <input type="range" id="speed-slider" min="0" max="85" step="0.5" value="0">
        </div>

        <!-- 車両形式選択 (data.jsonの諸元) -->
        <div class="control-group">
          <label for="car-type">被牽引車両形式</label>
          <select id="car-type">
            <option value="12kei">12系客車 (コロ軸受・自重32.0t)</option>
            <option value="14kei">14系客車 (コロ軸受・自重32.5t)</option>
            <option value="50kei">50系客車 (コロ軸受・自重28.0t)</option>
            <option value="koki50000">コキ50000系 (積車・44.0t)</option>
            <option value="koki_empty">コキ50000系 (空車・15.0t)</option>
            <option value="wam80000">ワム80000
